<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Horario semanal de la cocina Valle Real">
<title>Cocina Valle Real · Horario</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍳</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121110; --surface:#1a1916; --card:#22201c; --card2:#2b2823; --line:#35312a;
  --text:#f4efe7; --muted:#9a9182; --faint:#6b6458;
  --accent:#f2a33a; --accent-ink:#1a1206; --ok:#7fd36b; --warn:#f5c04a; --bad:#ff6b5a;
  --shadow:0 12px 32px rgba(0,0,0,.35);
  --fd:'Bricolage Grotesque',system-ui,sans-serif;
  --fb:'Manrope',system-ui,sans-serif;
  --fm:'JetBrains Mono',ui-monospace,monospace;
}
html[data-theme=light]{
  --bg:#f5f1ea; --surface:#fffdf9; --card:#ffffff; --card2:#f2ece3; --line:#e3dbcf;
  --text:#1d1a16; --muted:#6e6558; --faint:#a39a8c;
  --accent:#d9831a; --accent-ink:#ffffff; --ok:#3f9d2f; --warn:#b98400; --bad:#d63b2b;
  --shadow:0 10px 26px rgba(60,40,10,.09);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--fb);min-height:100vh;padding-bottom:120px;transition:background .2s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}
b{font-weight:800}

/* TOP BAR */
.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px;height:62px}
.brand{font:800 20px var(--fd);letter-spacing:-.5px;display:flex;align-items:center;gap:8px;margin-right:auto;white-space:nowrap}
.brand b{color:var(--accent)}
.icon-btn{min-width:40px;height:40px;padding:0 10px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--card);border:1px solid var(--line);font-size:16px;font-weight:700;white-space:nowrap}
.icon-btn .t{font-size:13px}
.icon-btn.on{border-color:var(--accent);color:var(--accent)}
@media(max-width:520px){.icon-btn .t{display:none}.brand{font-size:17px}}

/* WEEK BAR */
.weekbar{display:flex;align-items:center;gap:8px;margin:16px 0 18px}
.weekbar .lbl{flex:1;text-align:center;min-width:0}
.wk-k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
.wk-t{font:800 18px var(--fd)}
.pill{padding:9px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap}
.pill.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.navb{width:42px;height:42px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:20px;font-weight:800}

/* PICK */
.pick{padding-top:18px}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:800}
.pick h1{font:800 clamp(34px,8vw,56px)/1.02 var(--fd);letter-spacing:-1.5px;margin:8px 0 8px}
.lead{color:var(--muted);margin-bottom:22px;max-width:520px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.person{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 16px 20px;text-align:left;display:flex;flex-direction:column;gap:14px;transition:transform .15s,border-color .15s,box-shadow .15s;position:relative;overflow:hidden}
.person:hover,.person:focus-visible{transform:translateY(-3px);border-color:var(--pc);box-shadow:var(--shadow)}
.person::after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--pc)}
.avatar{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font:800 19px var(--fd);background:color-mix(in srgb,var(--pc) 22%,transparent);color:var(--pc)}
.person .nm{display:block;font:800 21px var(--fd);letter-spacing:-.3px}
.person .td{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.person .td b{color:var(--text)}
.link-btn{margin-top:22px;font-weight:800;color:var(--accent);padding:8px 0}

/* ME */
.hello{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.hello h2{font:800 26px/1.1 var(--fd);letter-spacing:-.5px}
.hello .sub{color:var(--muted);font-size:13px}
.hello .avatar{width:48px;height:48px}
.hello .sp{margin-left:auto}
.hero{border-radius:26px;padding:22px 22px 24px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 30%,var(--card)) 0%,var(--card) 72%);border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero .kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;position:relative}
.hero .shift{font:800 clamp(38px,10vw,64px)/1 var(--fd);letter-spacing:-2px;margin:10px 0 6px;color:var(--c);position:relative}
.hero .time{font:700 clamp(20px,5.2vw,30px) var(--fm);position:relative}
.hero .status{margin-top:16px;font-weight:600;position:relative}
.hero .note{margin-top:10px;font-size:14px;position:relative}
.hero .bg-emoji{position:absolute;right:-14px;top:-18px;font-size:150px;opacity:.13;pointer-events:none;user-select:none}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--text) 12%,transparent);overflow:hidden;margin-top:10px;position:relative}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .6s}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;position:relative}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;background:color-mix(in srgb,var(--c,var(--muted)) 18%,transparent);color:var(--c,var(--muted));white-space:nowrap}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin:16px 0}
@media(max-width:760px){.strip{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:40%;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 8px;margin-left:-2px}.strip>*{scroll-snap-align:start}}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:3px;min-height:128px;text-align:left}
.dcard.today{outline:2px solid var(--accent);outline-offset:2px}
.dcard .dn{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.dcard .dd{font:800 24px/1.1 var(--fd)}
.dcard .sh{font-weight:800;color:var(--c);margin-top:6px}
.dcard .tm{font:500 12px var(--fm);color:var(--muted)}
.dcard .chip{align-self:flex-start;margin-top:4px;font-size:11px;padding:3px 8px}
.dcard .dnote{font-size:11.5px;color:var(--muted);margin-top:4px}
.dcard.work{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 18%,var(--card)),var(--card))}
.dcard.off .sh,.dcard.none .sh{color:var(--muted)}
.dcard.past{opacity:.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.stat .v{font:800 28px/1.1 var(--fd)}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.actions .pill{display:inline-flex;align-items:center;gap:6px}

/* CARDS / SECTIONS */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px}
.card h4{font:800 17px var(--fd);margin-bottom:4px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:34px 0 12px;flex-wrap:wrap}
.sec-h h3{font:800 24px/1.1 var(--fd);letter-spacing:-.5px}
.sec-h .sub{color:var(--muted);font-size:13px}
.task{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--card2);margin-top:8px;width:100%;text-align:left;font-weight:700}
.task .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--faint);display:grid;place-items:center;font-size:14px;flex-shrink:0;color:transparent}
.task.done .box{background:var(--ok);border-color:var(--ok);color:#0d1a08}
.task.done .tn{text-decoration:line-through;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* TEAM GRID */
.gridwrap{overflow-x:auto;border-radius:22px;border:1px solid var(--line);background:var(--surface);-webkit-overflow-scrolling:touch}
table.grid{width:100%;min-width:760px;border-collapse:collapse}
.grid th,.grid td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center;transition:opacity .2s}
.grid tr:last-child td{border-bottom:0}
.grid thead th{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:12px 4px 10px;cursor:pointer;user-select:none}
.grid thead th .d{font:800 18px var(--fd);color:var(--text);display:block;letter-spacing:0;text-transform:none}
.grid thead th.todaycol .d,.grid thead th.todaycol{color:var(--accent)}
.grid thead th.sel{box-shadow:inset 0 -3px 0 var(--accent)}
.grid thead th .hn{font-size:11px}
.grid .namecell{position:sticky;left:0;background:var(--surface);text-align:left;padding-left:12px;min-width:140px;z-index:2}
.grid thead .namecell{cursor:default}
.nmw{display:flex;align-items:center;gap:9px;font-weight:800}
.hrs{font:500 11px var(--fm);color:var(--muted)}
.hrs.over{color:var(--bad)}
.mini-av{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font:800 12px var(--fd);background:color-mix(in srgb,var(--pc) 22%,transparent);color:var(--pc);flex-shrink:0}
.cell{width:100%;min-height:64px;border-radius:13px;padding:6px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:color-mix(in srgb,var(--c) 15%,transparent);border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);transition:transform .12s;position:relative}
.cell .s{font-weight:800;color:var(--c);font-size:12px;letter-spacing:.06em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .t{font:500 10.5px var(--fm);color:var(--muted);white-space:nowrap}
.cell .a{font-size:12px;line-height:1.2}
.cell .nd{position:absolute;top:3px;right:5px;font-size:10px}
.cell.off{--c:var(--faint);background:transparent;border-style:dashed}
.cell.none{--c:var(--faint);background:transparent;border:1.5px dashed var(--line)}
.cell:active{transform:scale(.95)}
td.todaycol{background:color-mix(in srgb,var(--accent) 6%,transparent)}
tr.me>td,tr.me>td.namecell{background:color-mix(in srgb,var(--accent) 11%,var(--surface))}
tr.me>td.namecell{box-shadow:inset 4px 0 0 var(--accent)}
tr.me .cell{min-height:78px}
tr.me .cell .s{font-size:14px}
tr.me .cell .t{font-size:11.5px;color:var(--text)}
table.focus tbody tr.staff:not(.me){opacity:.42}
table.focus tbody tr.staff:not(.me):hover{opacity:1}
.cov td{font-size:11px;color:var(--muted);padding:10px 4px;font-weight:700}
.cov .n{font:800 17px var(--fd);color:var(--text);display:block}
.cov td.low .n{color:var(--warn)}
.is-admin .grid .cell{cursor:pointer}
@media(hover:hover){.is-admin .grid .cell:hover{transform:scale(1.04)}}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.toggle .sw{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;transition:.2s}
.toggle .sw::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--text);transition:.2s}
.toggle.on .sw{background:var(--accent)}
.toggle.on .sw::after{left:19px;background:var(--accent-ink)}

/* TIMELINE */
.tl{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:14px}
.tl-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tl-head h4{font:800 18px var(--fd)}
.tl-days{display:flex;gap:4px;overflow-x:auto}
.tl-days button{padding:7px 10px;border-radius:10px;font-size:12px;font-weight:800;color:var(--muted);border:1px solid var(--line)}
.tl-days button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tl-days button.tdy:not(.on){color:var(--accent)}
.tl-body{margin-top:14px;position:relative}
.tl-scale{position:relative;height:18px;margin-left:96px;font:500 10px var(--fm);color:var(--muted)}
.tl-scale span{position:absolute;transform:translateX(-50%);white-space:nowrap}
@media(max-width:600px){.tl-scale span.odd{display:none}.tl-name{width:78px}.tl-scale{margin-left:78px}}
.tl-row{display:flex;align-items:center;height:40px}
.tl-name{width:96px;font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.tl-track{flex:1;position:relative;height:30px;border-radius:9px;background:var(--card)}
.tl-track .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.tl-bar{position:absolute;top:3px;bottom:3px;border-radius:8px;background:var(--c);color:#14110c;font:700 11px var(--fm);display:flex;align-items:center;padding:0 8px;white-space:nowrap;overflow:hidden;box-shadow:0 2px 8px color-mix(in srgb,var(--c) 40%,transparent)}
.tl-off{position:absolute;inset:0;display:flex;align-items:center;padding-left:10px;font-size:12px;color:var(--muted);font-weight:700}
.tl-now{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--bad);border-radius:2px;z-index:3}
.tl-now::before{content:'';position:absolute;top:-3px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.tl-foot{margin-top:12px;font-size:13px;color:var(--muted)}
.tl-foot b{color:var(--text)}
.daynote{margin-top:12px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--accent) 12%,transparent);font-size:14px}

/* CLEANING */
.crow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.crow:last-child{border-bottom:0}
.crow .who{display:flex;align-items:center;gap:9px;font-weight:800;min-width:130px}
.crow .tasks{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.crow.me{background:color-mix(in srgb,var(--accent) 10%,transparent);margin:0 -18px;padding:12px 18px}
.tchip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;border:1.5px solid color-mix(in srgb,var(--accent) 60%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent);font-size:12px;font-weight:700}
.tchip.done{opacity:.55;text-decoration:line-through}

/* WARNINGS */
.warns{border-color:color-mix(in srgb,var(--warn) 50%,var(--line));background:color-mix(in srgb,var(--warn) 7%,var(--card))}
.warns ul{list-style:none;display:flex;flex-direction:column;gap:6px;margin-top:8px}
.warns li{font-size:14px}
.okline{color:var(--ok);font-weight:700}
.banner{margin-top:14px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--warn) 14%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* DOCK */
.dock{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:8px;display:flex;gap:6px;align-items:center;width:max-content;max-width:calc(100% - 20px)}
.dock .brushes{display:flex;gap:6px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:none}
.dock .brushes::-webkit-scrollbar{display:none}
.dock>.icon-btn,.dock>.pub{flex-shrink:0}
@media(max-width:520px){.dock .pub{padding:10px 11px}}
.dock .lab2{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:0 4px;white-space:nowrap}
.brush{padding:9px 11px;border-radius:12px;font-weight:800;font-size:12px;white-space:nowrap;border:1.5px solid transparent;color:var(--c,var(--text));background:color-mix(in srgb,var(--c,var(--muted)) 15%,transparent)}
.brush.on{border-color:var(--c,var(--text));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--text)) 25%,transparent)}
.dock .sep{width:1px;align-self:stretch;background:var(--line);flex-shrink:0}
.pub{background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:12px;font-weight:800;white-space:nowrap}
.pub.clean{background:var(--card);color:var(--ok);border:1px solid var(--line)}
.pub[disabled]{opacity:.6}
.paint-hint{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:59;background:var(--text);color:var(--bg);font-size:12px;font-weight:800;padding:6px 12px;border-radius:99px;white-space:nowrap}

/* SHEET */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:100;background:var(--surface);border-radius:26px 26px 0 0;max-height:90vh;overflow-y:auto;padding:10px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:580px;margin:0 auto;box-shadow:0 -12px 40px rgba(0,0,0,.4);border:1px solid var(--line);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
@media(min-width:700px){.sheet{bottom:24px;border-radius:26px}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:2px auto 14px}
.sheet h3{font:800 24px/1.1 var(--fd);letter-spacing:-.5px}
.sheet .sub{color:var(--muted);font-size:13px;margin-top:2px}
.lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:18px 0 8px}
.lab.sm{margin-top:12px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opt{padding:12px;border-radius:15px;border:1.5px solid var(--line);background:var(--card);text-align:left}
.opt .o1{font-weight:800;color:var(--c,var(--text));display:block}
.opt .o2{font:500 11.5px var(--fm);color:var(--muted);display:block;margin-top:2px}
.opt.on{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 15%,var(--card))}
.qrow{display:flex;flex-wrap:wrap;gap:6px}
.q{padding:8px 11px;border-radius:11px;background:var(--card);border:1.5px solid var(--line);font:700 12.5px var(--fb)}
.q.mono{font-family:var(--fm);font-weight:500}
.q.on{border-color:var(--c,var(--accent));color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 12%,var(--card))}
.custom{margin-top:12px;padding:14px;border-radius:18px;border:1.5px solid color-mix(in srgb,#b58cff 55%,var(--line));background:color-mix(in srgb,#b58cff 7%,var(--surface))}
.timebox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfield{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:10px 8px;min-width:0}
.tin input::-webkit-calendar-picker-indicator{display:none}
@media(max-width:420px){.tin input{font-size:16px}.nudge{width:30px;height:32px}.custom{padding:10px}}
.tfield label{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.tin{display:flex;align-items:center;gap:4px;margin-top:6px}
.tin input{flex:1;min-width:0;background:transparent;border:0;font:700 19px var(--fm);color:var(--text);outline:none;text-align:center;color-scheme:dark}
html[data-theme=light] .tin input{color-scheme:light}
.nudge{width:34px;height:34px;border-radius:10px;background:var(--card2);font-weight:800;font-size:16px;flex-shrink:0}
.t12{font:500 11px var(--fm);color:var(--muted);text-align:center;margin-top:4px}
.durline{margin-top:10px;font-size:14px}
.input{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
.input:focus{border-color:var(--accent)}
.input.sm{padding:8px 10px;font-size:14px}
.row-btns{display:flex;gap:8px;margin-top:22px;position:sticky;bottom:-20px;background:var(--surface);padding:10px 0 4px}
.btn{flex:1;padding:13px;border-radius:14px;font-weight:800;background:var(--card);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.menu-list{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.mi{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left;font-weight:700}
.mi .ic{font-size:18px;width:24px;text-align:center}
.mi small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.mi.danger{color:var(--bad)}
.ed-row{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.ed-row input[type=color]{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:2px;flex-shrink:0}
.ed-row .input{flex:1;min-width:0}
.sbtn{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:800;flex-shrink:0}
.sbtn.danger{color:var(--bad)}
.sbtn.confirm{background:var(--bad);color:#fff;width:auto;padding:0 10px;font-size:12px}
.shift-ed{padding:12px;border-radius:15px;background:var(--card);border:1px solid var(--line);margin-top:8px;display:grid;grid-template-columns:36px 1fr 70px;gap:8px;align-items:center}
.shift-ed .times{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.shift-ed .times input{flex:1}
.help{font-size:13px;color:var(--muted);line-height:1.5}
.help a{color:var(--accent)}
.help ol{padding-left:18px;margin-top:6px}
.linkrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.linkrow .u{flex:1;min-width:0;font:500 11px var(--fm);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinbox{font:700 32px var(--fm);letter-spacing:.4em;text-align:center}

/* TOAST / FOOT */
.toast{position:fixed;left:50%;top:74px;transform:translate(-50%,-16px);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:800;font-size:13px;z-index:200;opacity:0;transition:.22s;pointer-events:none;max-width:92vw;text-align:center;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{margin-top:40px;text-align:center;font-size:12px;color:var(--muted)}
.loading{padding:80px 0;text-align:center;color:var(--muted)}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* PRINT */
@media print{
  @page{size:A4 landscape;margin:8mm}
  :root,html[data-theme]{--bg:#fff;--surface:#fff;--card:#fff;--card2:#f4f4f4;--line:#ccc;--text:#111;--muted:#555;--faint:#999}
  body{padding:0;font-size:11px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .noprint,.top,.dock,.paint-hint,.weekbar button,.hello,.hero,.strip,.stats,.actions,.my-tasks,.tl,.warns,.banner,.foot,.toggle,.sheet,.scrim{display:none!important}
  .wrap{max-width:none;padding:0}
  .sec-h{margin:0 0 6px}
  .weekbar{margin:0 0 6px}
  table.grid{min-width:0}
  table.focus tbody tr.staff{opacity:1!important}
  .gridwrap{overflow:visible;border-radius:6px}
  .cell{min-height:40px!important}
  .card{break-inside:avoid}
}
</style>
</head>
<body>

<header class="top noprint">
  <div class="wrap">
    <button class="brand" data-act="home" aria-label="Inicio">🍳 Cocina <b>Valle Real</b></button>
    <button class="icon-btn" id="teamBtn" data-act="team" title="Horario del equipo">👥<span class="t">Equipo</span></button>
    <button class="icon-btn" id="themeBtn" data-act="theme" title="Cambiar tema">🌙</button>
    <button class="icon-btn" id="adminBtn" data-act="admin" title="Modo administrador">🔒</button>
  </div>
</header>

<main class="wrap" id="app"><div class="loading">Cargando horario…</div></main>

<div class="scrim" id="scrim" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
/* ═══════════ UTILIDADES ═══════════ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const LS = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const hashPin = s => { let h = 5381; for (const c of String(s)) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return 'h' + h.toString(16); };
const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'persona';
const initials = n => n.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();

const DAYS   = ['Jueves','Viernes','Sábado','Domingo','Lunes','Martes','Miércoles'];
const DAYS_S = ['Jue','Vie','Sáb','Dom','Lun','Mar','Mié'];
const MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const CUSTOM_COLOR = '#b58cff';
/* Ausencias de día completo: no cuentan como trabajo ni como descanso */
const AWAY = {
  V: { name:'Vacaciones', short:'VAC',  color:'#2bc4a9', emoji:'🌴', sub:'Días de vacaciones' },
  P: { name:'Permiso',    short:'PERM', color:'#f472b6', emoji:'📄', sub:'Falta justificada' }
};
const LABEL_IDEAS = ['Capacitación', 'Inventario', 'Evento', 'Doble turno', 'Medio día'];
const NOTE_IDEAS = { V: ['Regresa el lunes', 'Vacaciones de ley'], P: ['Cita médica', 'Asunto personal', 'Trámite', 'Incapacidad'] };
const PALETTE = ['#f2a33a','#4f9cf7','#e86aa6','#4fd1a5','#b58cff','#ff7a59','#e2c044','#5ec8e5','#9bd35a','#f07ad2'];
const QUICK_STARTS = ['06:00','06:30','07:00','07:30','08:00','08:30','09:00','09:30','10:00','11:00','12:00','13:00'];

/* Fechas: la semana de cocina va de jueves (0) a miércoles (6) */
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const thursdayOf = d => addDays(d, -((d.getDay() + 3) % 7));
const dayIdxOf = d => (d.getDay() + 3) % 7;
const thisWeek = () => iso(thursdayOf(new Date()));

/* Horas */
const toMin = t => { const [h, m] = String(t).split(':').map(Number); return (h || 0) * 60 + (m || 0); };
const toHHMM = m => { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
const fmt = t => { const m = toMin(t), h = Math.floor(m / 60) % 24; return `${h % 12 || 12}:${pad(m % 60)} ${h < 12 ? 'am' : 'pm'}`; };
const fmtS = t => { const m = toMin(t), h = Math.floor(m / 60) % 24; return `${h % 12 || 12}:${pad(m % 60)}`; };
const dur = (s, e) => { let d = toMin(e) - toMin(s); if (d <= 0) d += 1440; return d; };
const fmtDur = m => m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? ' ' + (m % 60) + ' min' : ''}`;
const fmtHrs = m => (Math.round(m / 6) / 10).toString().replace('.', ',');

/* ═══════════ DATOS ═══════════ */
const DEFAULT_DATA = {
  version: 2, updated: null,
  config: {
    shifts: [
      { id:'M', name:'Matutino',   short:'MAT', start:'07:00', end:'14:00', color:'#f2a33a' },
      { id:'I', name:'Intermedio', short:'INT', start:'08:30', end:'15:30', color:'#4f9cf7' }
    ],
    areas: [
      { id:'hot',  name:'Caliente', icon:'🔥', color:'#ff6b4a' },
      { id:'cold', name:'Fría',     icon:'❄️', color:'#38c3ff' },
      { id:'dish', name:'Loza',     icon:'🍽️', color:'#8fd35a' }
    ],
    cleanTasks: [
      { id:'filtros', name:'Filtros', icon:'🌀' }, { id:'campana', name:'Campana', icon:'💨' },
      { id:'freidora', name:'Freidora', icon:'🍟' }, { id:'refri', name:'Refrigerador', icon:'🧊' },
      { id:'lineafria', name:'Línea fría', icon:'🥗' }, { id:'loza', name:'Loza', icon:'🍽️' },
      { id:'repisas', name:'Repisas', icon:'🗄️' }, { id:'plancha', name:'Plancha', icon:'🔥' },
      { id:'fogones', name:'Fogones', icon:'🍳' }, { id:'paredes', name:'Paredes', icon:'🧽' },
      { id:'congelador', name:'Congelador', icon:'❄️' }
    ],
    maxHours: 48, minPerDay: 2
  },
  staff: [
    { id:'marcos', name:'Marcos', color:'#f2a33a' }, { id:'cubre', name:'Cubre turnos', color:'#4f9cf7' },
    { id:'gisselle', name:'Gisselle', color:'#e86aa6' }, { id:'alexis', name:'Alexis', color:'#4fd1a5' }
  ],
  weeks: {}
};

let DATA = null;         // copia de trabajo
let PUB_STR = '';        // lo publicado, para saber si hay cambios
let PUB_UPDATED = null;
let SOURCE = 'server';

const S = {
  week: thisWeek(), view: 'pick', person: null, admin: false,
  brush: null, brushCustom: { start: '09:00', end: '16:00' },
  day: null, focus: true, undo: [], staleDraft: false, confirmDel: null
};

function normalize(d) {
  d.config = Object.assign(clone(DEFAULT_DATA.config), d.config || {});
  d.staff = Array.isArray(d.staff) ? d.staff : [];
  d.weeks = d.weeks || {};
  return d;
}
const staffById = id => DATA.staff.find(s => s.id === id);
const shiftById = id => DATA.config.shifts.find(s => s.id === id);
const areaById = id => DATA.config.areas.find(a => a.id === id) || null;

function weekObj(k = S.week, create = false) {
  let w = DATA.weeks[k];
  if (!w && create) w = DATA.weeks[k] = { days: {}, clean: {}, notes: Array(7).fill('') };
  if (w) { w.days = w.days || {}; w.clean = w.clean || {}; w.notes = w.notes || Array(7).fill(''); }
  return w;
}
const getE = (pid, d, k = S.week) => { const w = DATA.weeks[k]; return (w && w.days && w.days[pid] && w.days[pid][d]) || null; };
function setE(pid, d, e, k = S.week) {
  const w = weekObj(k, true);
  if (!w.days[pid]) w.days[pid] = Array(7).fill(null);
  w.days[pid][d] = e ? clone(e) : null;
}
const dayNote = (d, k = S.week) => { const w = DATA.weeks[k]; return (w && w.notes && w.notes[d]) || ''; };
function getClean(pid, k = S.week, create = false) {
  const w = weekObj(k, create);
  if (!w) return { tasks: [], note: '' };
  if (!w.clean[pid]) { if (!create) return { tasks: [], note: '' }; w.clean[pid] = { tasks: [], note: '' }; }
  return w.clean[pid];
}

/* Traduce una entrada del horario a algo que se pueda dibujar */
function info(e) {
  const none = { kind:'none', name:'Sin asignar', short:'—', color:'var(--faint)', mins:0 };
  if (!e) return none;
  if (e.s === 'D') return { kind:'off', name:'Descanso', short:'DESC', color:'var(--faint)', mins:0, note:e.n || '' };
  if (AWAY[e.s]) { const a = AWAY[e.s]; return { kind:'away', name:a.name, short:a.short, color:a.color, emoji:a.emoji, mins:0, note:e.n || '' }; }
  let sh;
  if (e.s === 'C') sh = { name:e.label || 'Personalizado', short:e.label ? e.label.toUpperCase() : 'PERS', start:e.start, end:e.end, color:CUSTOM_COLOR };
  else sh = shiftById(e.s);
  if (!sh || !sh.start || !sh.end) return none;
  return { kind:'work', name:sh.name, short:sh.short, start:sh.start, end:sh.end, color:sh.color,
           area:areaById(e.a), note:e.n || '', mins:dur(sh.start, sh.end) };
}
function personStats(pid, k = S.week) {
  let mins = 0, work = 0, off = 0, none = 0, away = 0;
  for (let d = 0; d < 7; d++) {
    const i = info(getE(pid, d, k));
    if (i.kind === 'work') { mins += i.mins; work++; } else if (i.kind === 'off') off++; else if (i.kind === 'away') away++; else none++;
  }
  return { mins, work, off, none, away };
}
function weekLabel(k) {
  const s = fromIso(k), e = addDays(s, 6);
  return `${s.getDate()}${s.getMonth() === e.getMonth() ? '' : ' ' + MONTHS[s.getMonth()]} – ${e.getDate()} ${MONTHS[e.getMonth()]}`;
}
function relWeek(k) {
  const diff = Math.round((fromIso(k) - fromIso(thisWeek())) / (7 * 864e5));
  if (diff === 0) return 'Esta semana';
  if (diff === 1) return 'Próxima semana';
  if (diff === -1) return 'Semana pasada';
  return diff > 0 ? `En ${diff} semanas` : `Hace ${-diff} semanas`;
}
const todayIdx = () => S.week === thisWeek() ? dayIdxOf(new Date()) : -1;
const nowMin = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); };
const personLink = pid => location.origin + location.pathname + '?p=' + encodeURIComponent(pid);
const isDirty = () => JSON.stringify(DATA) !== PUB_STR;

/* ═══════════ CARGA / GUARDADO ═══════════ */
async function load() {
  let pub = null;
  try {
    const r = await fetch('horario.json?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) pub = await r.json();
  } catch (e) {}
  if (pub) { SOURCE = 'server'; LS.set('cvr-cache', pub); }
  else { pub = LS.get('cvr-cache'); SOURCE = pub ? 'cache' : 'default'; if (!pub) pub = clone(DEFAULT_DATA); }
  normalize(pub);
  PUB_STR = JSON.stringify(pub);
  PUB_UPDATED = pub.updated;
  DATA = pub;
  S.admin = !!LS.get('cvr-admin', false);
  if (S.admin) applyDraft();
}
function applyDraft() {
  const draft = LS.get('cvr-draft');
  if (draft && draft.data) {
    DATA = normalize(draft.data);
    S.staleDraft = draft.base !== PUB_UPDATED && isDirty();
  }
}
function saveDraft() {
  if (isDirty()) LS.set('cvr-draft', { data: DATA, base: PUB_UPDATED });
  else LS.del('cvr-draft');
}
function mutate(fn) {
  S.undo.push(JSON.stringify(DATA));
  if (S.undo.length > 40) S.undo.shift();
  fn();
  saveDraft();
  render();
}
function undo() {
  if (!S.undo.length) return;
  DATA = normalize(JSON.parse(S.undo.pop()));
  saveDraft(); render(); toast('↶ Cambio deshecho');
}

/* ═══════════ URL ═══════════ */
function readURL() {
  const q = new URLSearchParams(location.search);
  const w = q.get('w');
  if (w && /^\d{4}-\d{2}-\d{2}$/.test(w)) S.week = iso(thursdayOf(fromIso(w)));
  const p = q.get('p');
  const find = v => DATA.staff.find(s => s.id === v || s.name.toLowerCase() === String(v).toLowerCase());
  if (p && find(p)) { S.person = find(p).id; S.view = 'me'; LS.set('cvr-me', S.person); }
  else if (q.get('v') === 'equipo') S.view = 'team';
  else { const saved = LS.get('cvr-me'); if (saved && staffById(saved)) { S.person = saved; S.view = 'me'; } }
  S.wantAdmin = q.has('admin');
}
function writeURL() {
  const q = new URLSearchParams();
  if (S.view === 'me' && S.person) q.set('p', S.person);
  else if (S.view === 'team') q.set('v', 'equipo');
  if (S.week !== thisWeek()) q.set('w', S.week);
  const s = q.toString();
  history.replaceState(null, '', location.pathname + (s ? '?' + s : ''));
}

/* ═══════════ VISTAS ═══════════ */
function render() {
  document.body.classList.toggle('is-admin', S.admin);
  $('#adminBtn').classList.toggle('on', S.admin);
  $('#adminBtn').innerHTML = S.admin ? '🔓<span class="t">Admin</span>' : '🔒';
  $('#teamBtn').classList.toggle('on', S.view === 'team');
  const sx = window.scrollX, sy = window.scrollY;
  const gx = $('.gridwrap') ? $('.gridwrap').scrollLeft : 0;
  let html = '';
  if (S.view === 'pick') html = viewPick();
  else {
    if (S.day == null || S.day > 6) S.day = todayIdx() >= 0 ? todayIdx() : 0;
    html = viewWeekbar() + (S.admin ? viewAdminTop() : '') + (S.view === 'me' ? viewMe() : '') + viewTeam();
  }
  html += viewFoot();
  $('#app').innerHTML = html;
  if ($('.gridwrap')) $('.gridwrap').scrollLeft = gx;
  window.scrollTo(sx, sy);
  renderDock();
  writeURL();
}

function viewPick() {
  const tk = thisWeek(), ti = dayIdxOf(new Date());
  const h = new Date().getHours();
  const greet = h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
  const people = DATA.staff.map(st => {
    const i = info(getE(st.id, ti, tk));
    const txt = i.kind === 'work' ? `Hoy <b>${esc(i.name)}</b> · ${fmt(i.start)}`
      : i.kind === 'off' ? 'Hoy <b>descansa</b> 😴'
      : i.kind === 'away' ? `Hoy <b>${esc(i.name.toLowerCase())}</b> ${i.emoji}` : 'Hoy sin asignar';
    return `<button class="person" style="--pc:${st.color}" data-act="pick" data-id="${esc(st.id)}">
      <span class="avatar">${esc(initials(st.name))}</span>
      <span><span class="nm">${esc(st.name)}</span><span class="td">${txt}</span></span></button>`;
  }).join('');
  return `<section class="pick fade">
    <div class="kicker">${greet} · ${DAYS[ti]} ${new Date().getDate()} ${MONTHS[new Date().getMonth()]}</div>
    <h1>¿Quién eres?</h1>
    <p class="lead">Toca tu nombre para ver tu horario. Este teléfono lo recordará y la próxima vez entrarás directo.</p>
    <div class="people">${people || '<p class="empty">Aún no hay personas en el equipo.</p>'}</div>
    <button class="link-btn" data-act="team">Ver el horario completo del equipo →</button>
  </section>`;
}

function viewWeekbar() {
  const isNow = S.week === thisWeek();
  return `<div class="weekbar">
    <button class="navb noprint" data-act="week" data-v="-1" aria-label="Semana anterior">‹</button>
    <div class="lbl"><div class="wk-k">${relWeek(S.week)} · Jue a Mié</div><div class="wk-t">${weekLabel(S.week)}</div></div>
    <button class="navb noprint" data-act="week" data-v="1" aria-label="Semana siguiente">›</button>
    ${isNow ? '' : '<button class="pill accent noprint" data-act="week" data-v="0">Hoy</button>'}
  </div>`;
}

function nextShift(pid, fromDay) {
  for (let off = 1; off <= 14; off++) {
    const date = addDays(fromIso(S.week), fromDay + off);
    const i = info(getE(pid, dayIdxOf(date), iso(thursdayOf(date))));
    if (i.kind === 'work') return `Siguiente turno: <b>${DAYS[dayIdxOf(date)]} ${date.getDate()}</b> · ${esc(i.name)} ${fmt(i.start)}`;
  }
  return 'Tu siguiente turno aún no está publicado.';
}

function heroCard(pid) {
  const ti = todayIdx();
  if (ti < 0) {
    const st = personStats(pid);
    return `<div class="hero" id="hero" style="--c:var(--accent)">
      <div class="kick">${relWeek(S.week)}</div>
      <div class="shift" style="font-size:clamp(30px,8vw,48px)">${weekLabel(S.week)}</div>
      <div class="time">${fmtHrs(st.mins)} h · ${st.work} turnos</div>
      <div class="status">${st.none === 7 ? 'Esta semana aún no tiene horario.' : 'Revisa tus días abajo 👇'}</div>
      <div class="bg-emoji">📅</div></div>`;
  }
  const i = info(getE(pid, ti));
  const date = addDays(fromIso(S.week), ti);
  let status = '', pct = null, emoji = '🍳';
  if (i.kind === 'work') {
    const s = toMin(i.start), e = s + i.mins, n = nowMin();
    if (n < s) status = `⏳ Entras en <b>${fmtDur(s - n)}</b>`;
    else if (n < e) { pct = Math.round((n - s) / (e - s) * 100); status = `🔥 Estás en turno · sales en <b>${fmtDur(e - n)}</b>`; }
    else { status = `✅ Turno terminado. ${nextShift(pid, ti)}`; pct = 100; }
    if (i.area) emoji = i.area.icon;
  } else if (i.kind === 'off') { status = `Disfruta tu día. ${nextShift(pid, ti)}`; emoji = '😴'; }
  else if (i.kind === 'away') { status = `${i.emoji} ${i.kind === 'away' && AWAY.V.name === i.name ? '¡Disfruta tus vacaciones!' : 'Tienes permiso hoy.'} ${nextShift(pid, ti)}`; emoji = i.emoji; }
  else status = 'Tu turno de hoy todavía no está asignado.';
  const dn = dayNote(ti);
  return `<div class="hero" id="hero" style="--c:${i.color}">
    <div class="kick">Hoy · ${DAYS[ti]} ${date.getDate()} ${MONTHS[date.getMonth()]}</div>
    <div class="shift">${esc(i.kind === 'work' ? i.name : i.name)}</div>
    ${i.kind === 'work' ? `<div class="time">${fmt(i.start)} – ${fmt(i.end)}</div>
      <div class="chips">${i.area ? `<span class="chip" style="--c:${i.area.color}">${i.area.icon} ${esc(i.area.name)}</span>` : ''}<span class="chip">${fmtDur(i.mins)}</span></div>` : ''}
    ${i.note ? `<div class="note">📝 ${esc(i.note)}</div>` : ''}
    ${dn ? `<div class="note">📣 ${esc(dn)}</div>` : ''}
    <div class="status">${status}</div>
    ${pct != null ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ''}
    <div class="bg-emoji">${emoji}</div></div>`;
}

    ? `<ul>${w.map(x => `<li>${x}</li>`).join('')}</ul>` : '<div class="okline">✓ Todo en orden: cobertura, descansos y horas.</div>'}</div>`;

function warnings() {
  const out = [], cfg = DATA.config;
  const opening = Math.min(...cfg.shifts.map(s => toMin(s.start)));
  let unassigned = 0;
  for (let d = 0; d < 7; d++) {
    const working = DATA.staff.map(st => info(getE(st.id, d))).filter(i => i.kind === 'work');
    if (working.length < cfg.minPerDay) out.push(`👥 <b>${DAYS[d]}</b>: solo ${working.length} persona${working.length === 1 ? '' : 's'} trabajando (mínimo ${cfg.minPerDay}).`);
    else if (!working.some(i => toMin(i.start) <= opening)) out.push(`🔑 <b>${DAYS[d]}</b>: nadie entra a las ${fmt(toHHMM(opening))} para abrir.`);
  }
  DATA.staff.forEach(st => {
    const s = personStats(st.id);
    unassigned += s.none;
    if (s.mins > cfg.maxHours * 60) out.push(`⏱️ <b>${esc(st.name)}</b> tiene ${fmtHrs(s.mins)} h (máximo ${cfg.maxHours} h).`);
    if (s.none < 7 && s.off === 0 && s.none === 0 && s.away === 0) out.push(`😴 <b>${esc(st.name)}</b> no tiene día de descanso.`);
  });
  if (unassigned) out.push(`❔ Hay ${unassigned} turno${unassigned === 1 ? '' : 's'} sin asignar.`);
  return out;
}

function viewTimeline() {
  const d = S.day, ti = todayIdx(), ws = fromIso(S.week), date = addDays(ws, d);
  const items = DATA.staff.map(st => ({ st, i: info(getE(st.id, d)) }));
  const works = items.filter(x => x.i.kind === 'work');
  let lo = 6 * 60, hi = 17 * 60;
  works.forEach(x => { const s = toMin(x.i.start); lo = Math.min(lo, Math.floor(s / 60) * 60); hi = Math.max(hi, Math.ceil((s + x.i.mins) / 60) * 60); });
  const span = hi - lo, P = m => ((m - lo) / span * 100).toFixed(2) + '%';
  let ticks = '', scale = '';
  for (let h = lo; h <= hi; h += 60) {
    scale += `<span class="${((h - lo) / 60) % 2 ? 'odd' : ''}" style="left:${P(h)}">${(h / 60) % 12 || 12}${h / 60 < 12 ? 'a' : 'p'}</span>`;
    ticks += `<span class="tick" style="left:${P(h)}"></span>`;
  }
  const n = nowMin();
  const nowLine = d === ti && n >= lo && n <= hi ? `<span class="tl-now" style="left:${P(n)}"></span>` : '';
  const me = S.view === 'me' ? S.person : null;
  const rows = items.map(({ st, i }) => {
    let inner = '';
    if (i.kind === 'work') {
      const s = toMin(i.start);
      inner = `<span class="tl-bar" style="--c:${i.color};left:${P(s)};width:${(i.mins / span * 100).toFixed(2)}%">${fmtS(i.start)}–${fmtS(i.end)}${i.area ? ' ' + i.area.icon : ''}</span>`;
    } else inner = `<span class="tl-off">${i.kind === 'off' ? '😴 Descanso' : i.kind === 'away' ? `${i.emoji} ${esc(i.name)}${i.note ? ' · ' + esc(i.note) : ''}` : 'Sin asignar'}</span>`;
    return `<div class="tl-row"><div class="tl-name" ${st.id === me ? 'style="color:var(--accent)"' : ''}>${esc(st.name)}</div><div class="tl-track">${ticks}${inner}${nowLine}</div></div>`;
  }).join('');
  // Hora con más gente
  let best = 0, bs = null, be = null;
  for (let m = lo; m < hi; m += 15) {
    const c = works.filter(x => { const s = toMin(x.i.start); return m >= s && m < s + x.i.mins; }).length;
    if (c > best) { best = c; bs = m; be = m + 15; } else if (c === best && be === m) be = m + 15;
  }
  const note = dayNote(d);
  const noteUI = S.admin
    ? `<div class="lab">📣 Aviso del día (lo ve todo el equipo)</div><input class="input" data-change="daynote" value="${esc(note)}" placeholder="Ej. Evento de 80 personas, llega proveedor 9am…">`
    : (note ? `<div class="daynote">📣 ${esc(note)}</div>` : '');
  return `<div class="tl">
    <div class="tl-head"><h4>${DAYS[d]} ${date.getDate()} ${MONTHS[date.getMonth()]}</h4>
      <div class="tl-days noprint">${DAYS_S.map((x, k) => `<button class="${k === d ? 'on' : ''} ${k === ti ? 'tdy' : ''}" data-act="day" data-d="${k}">${x}</button>`).join('')}</div></div>
    <div class="tl-body"><div class="tl-scale">${scale}</div>${rows}</div>
    <div class="tl-foot">${works.length ? `<b>${works.length}</b> en cocina · Más gente: <b>${best}</b> entre ${fmt(toHHMM(bs))} y ${fmt(toHHMM(be))}` : 'Nadie trabaja este día.'}</div>
    ${noteUI}
  </div>`;
}

function renderDock() {

  if (!dock) { dock = document.createElement('div'); dock.id = 'dock'; dock.className = 'dock noprint'; document.body.appendChild(dock); }
  const b = (id, label, color) => `<button class="brush ${S.brush === id ? 'on' : ''}" ${color ? `style="--c:${color}"` : ''} data-act="brush" data-b="${id}">${label}</button>`;

/* ═══════════ HOJAS (modales) ═══════════ */
let SHEET = null;

function drawSheet() { if (!SHEET) return; const el = $('#sheet'), sc = el.scrollTop; el.innerHTML = '<div class="grab"></div>' + SHEET(); el.scrollTop = sc; }
function closeSheet() { SHEET = null; $('#sheet').classList.remove('open'); $('#scrim').classList.remove('open'); }

/* — Editor de celda — */
let E = null;
function openCell(pid, d) {
  const e = getE(pid, d) || {};
  E = { pid, d, s: e.s || '', start: e.start || S.brushCustom.start, end: e.end || S.brushCustom.end, a: e.a || '', n: e.n || '', label: e.label || '', days: [d] };
  if (!e.s) E.s = null;
  openSheet(sheetCell);
}
function sheetCell() {
  const st = staffById(E.pid), date = addDays(fromIso(S.week), E.d);
  const opt = (id, name, sub, color) => `<button class="opt ${E.s === id ? 'on' : ''}" style="--c:${color}" data-act="e-shift" data-v="${id}"><span class="o1">${name}</span><span class="o2">${sub}</span></button>`;
  const opts = DATA.config.shifts.map(s => opt(s.id, esc(s.name), `${fmtS(s.start)} – ${fmt(s.end)}`, s.color)).join('')
    + opt('C', 'Personalizado', 'Elige la hora exacta', CUSTOM_COLOR)
    + opt('D', '😴 Descanso', 'Día libre', 'var(--muted)')
    + Object.keys(AWAY).map(k => opt(k, `${AWAY[k].emoji} ${AWAY[k].name}`, AWAY[k].sub, AWAY[k].color)).join('')
    + opt('', 'Sin asignar', 'Dejar vacío', 'var(--faint)');
  const work = E.s && E.s !== 'D' && !AWAY[E.s];
  const away = AWAY[E.s];
  const labelUI = E.s === 'C' ? `<div class="lab">Texto del turno (opcional)</div>

    <div class="qrow" style="margin-top:8px">${LABEL_IDEAS.map(x => `<button class="q ${E.label === x ? 'on' : ''}" data-act="e-label" data-v="${x}">${x}</button>`).join('')}</div>` : '';
  const noteIdeas = away ? `<div class="qrow" style="margin-top:8px">${NOTE_IDEAS[E.s].map(x => `<button class="q ${E.n === x ? 'on' : ''}" data-act="e-noteidea" data-v="${x}">${x}</button>`).join('')}</div>` : '';
  const areas = work ? `<div class="lab">Área de trabajo</div><div class="qrow">
      <button class="q ${!E.a ? 'on' : ''}" data-act="e-area" data-v="">Sin área</button>
      ${DATA.config.areas.map(a => `<button class="q ${E.a === a.id ? 'on' : ''}" style="--c:${a.color}" data-act="e-area" data-v="${a.id}">${a.icon} ${esc(a.name)}</button>`).join('')}</div>` : '';
  return `<h3>${esc(st.name)}</h3><div class="sub">${DAYS[E.d]} ${date.getDate()} ${MONTHS[date.getMonth()]}</div>
    <div class="lab">Turno</div><div class="opts">${opts}</div>
    ${labelUI}
    ${E.s === 'C' ? customEditor('cell') : ''}
    ${areas}
    ${E.s !== '' ? `<div class="lab">${away ? 'Comentario' : `Nota para ${esc(st.name)}`} (opcional)</div>
    <input class="input" data-input="e-note" value="${esc(E.n)}" placeholder="${away ? 'Ej. Cita médica, regresa el jueves…' : 'Ej. Cubre evento, llega a inventario…'}">${noteIdeas}` : ''}
    <div class="lab">Aplicar a estos días</div>
    <div class="qrow">${DAYS_S.map((n, i) => `<button class="q ${E.days.includes(i) ? 'on' : ''}" data-act="e-day" data-v="${i}">${n}</button>`).join('')}
      <button class="q" data-act="e-allwork">Todos sus días de trabajo</button>
      <button class="q" data-act="e-allweek">Toda la semana</button></div>
    <div class="row-btns"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="e-save">Guardar${E.days.length > 1 ? ` (${E.days.length} días)` : ''}</button></div>`;
}
const tgt = t => t === 'brush' ? S.brushCustom : E;
function customEditor(t) {
  const T = tgt(t), m = dur(T.start, T.end);
  const tf = (k, label) => `<div class="tfield"><label>${label}</label><div class="tin">

function saveCell() {

/* ═══════════ ACCIONES ═══════════ */
let toastT;
function toast(msg, ms = 2400) {
  const t = $('#toast'); t.innerHTML = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms);
}
async function copyText(s) {
  try { await navigator.clipboard.writeText(s); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = s; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e2) {} ta.remove(); }
  toast('🔗 Link copiado');
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function copyWeek(from, to, rotate) {
  const src = DATA.weeks[from];
  if (!src || !Object.keys(src.days || {}).length) { toast('La semana de origen está vacía'); return; }
  mutate(() => {
    const w = weekObj(to, true);
    w.days = clone(src.days);
    if (rotate) Object.keys(w.days).forEach(pid => { const a = w.days[pid]; w.days[pid] = [a[6], ...a.slice(0, 6)]; });
  });
  toast(rotate ? '🔄 Copiada con descansos recorridos' : '📋 Semana copiada');
}
function downloadICS(pid) {
  const st = staffById(pid), ws = fromIso(S.week);
  const stamp = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const tx = s => String(s).replace(/[\\,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Cocina Valle Real//Horario//ES', 'CALSCALE:GREGORIAN'];
  let n = 0;
  for (let d = 0; d < 7; d++) {
    const i = info(getE(pid, d)); if (i.kind !== 'work') continue;
    const day = addDays(ws, d), s = toMin(i.start);
    const a = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 0, s);
    const b = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 0, s + i.mins);
    L.push('BEGIN:VEVENT', `UID:${S.week}-${pid}-${d}@cocina-valle-real`, `DTSTAMP:${stamp(new Date())}`,
      `DTSTART:${stamp(a)}`, `DTEND:${stamp(b)}`, `SUMMARY:${tx('🍳 Turno ' + i.name + ' · Cocina')}`,
      `DESCRIPTION:${tx([i.area ? 'Área: ' + i.area.name : '', i.note].filter(Boolean).join('\n'))}`,
      'BEGIN:VALARM', 'TRIGGER:-PT60M', 'ACTION:DISPLAY', 'DESCRIPTION:Entras a la cocina en 1 hora', 'END:VALARM', 'END:VEVENT');
    n++;
  }
  L.push('END:VCALENDAR');
  if (!n) { toast('No tienes turnos esta semana'); return; }
  download(`turnos-${pid}-${S.week}.ics`, L.join('\r\n'), 'text/calendar');
  toast(`📅 ${n} turnos listos para tu calendario (con aviso 1 h antes)`);
}
async function sharePerson(pid) {
  const st = staffById(pid), url = personLink(pid);
  const text = `Horario de cocina de ${st.name} · ${weekLabel(S.week)}`;
  if (navigator.share) { try { await navigator.share({ title: 'Cocina Valle Real', text, url }); } catch (e) {} }
  else copyText(url);
}
const b64 = s => { const bytes = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); };
async function ghFetch(g, method, body) {
  const api = `https://api.github.com/repos/${encodeURIComponent(g.owner)}/${encodeURIComponent(g.repo)}/contents/${g.path.split('/').map(encodeURIComponent).join('/')}`;
  const url = method === 'GET' ? `${api}?ref=${encodeURIComponent(g.branch)}&t=${Date.now()}` : api;
  const r = await fetch(url, { method, cache: 'no-store', headers: { Authorization: 'Bearer ' + g.token, Accept: 'application/vnd.github+json' }, body: body ? JSON.stringify(body) : undefined });
  return r;
}
async function ghError(r) {
  let m = ''; try { m = (await r.json()).message; } catch (e) {}
  if (r.status === 401) return 'Token inválido o vencido';
  if (r.status === 403) return 'El token no tiene permiso de escritura (Contents: Read and write)';
  if (r.status === 404) return 'No se encontró el repositorio o la rama';
  if (r.status === 409) return 'Conflicto: alguien publicó al mismo tiempo, intenta de nuevo';
  return `Error ${r.status}${m ? ': ' + m : ''}`;
}
async function publish() {
  const g = ghCfg();
  if (!g.token) { openSheet(sheetGH); toast('Primero conecta GitHub (solo una vez)'); return; }
  if (!isDirty()) { toast('No hay cambios por publicar'); return; }
  const btn = $('#pubBtn'); if (btn) { btn.disabled = true; btn.textContent = 'Publicando…'; }
  try {
    const cur = await ghFetch(g, 'GET');
    let sha;
    if (cur.ok) sha = (await cur.json()).sha;
    else if (cur.status !== 404) throw new Error(await ghError(cur));
    const out = clone(DATA); out.updated = new Date().toISOString();
    const res = await ghFetch(g, 'PUT', { message: `Horario actualizado (${weekLabel(S.week)})`, content: b64(JSON.stringify(out, null, 1) + '\n'), branch: g.branch, sha });
    if (!res.ok) throw new Error(await ghError(res));
    DATA = out; PUB_STR = JSON.stringify(out); PUB_UPDATED = out.updated;
    LS.set('cvr-cache', out); LS.del('cvr-draft'); S.staleDraft = false;
    render();
    toast('✅ Publicado. El equipo lo verá en 1–2 minutos.', 4000);
  } catch (err) {
    toast('❌ ' + esc(err.message || 'No se pudo publicar'), 5000);
    renderDock();
  }
}

  switch() { LS.del('cvr-me'); S.person = null; S.view = 'pick'; render(); window.scrollTo(0, 0); },
  team() { S.view = S.view === 'team' ? (S.person ? 'me' : 'pick') : 'team'; render(); window.scrollTo(0, 0); },
  theme() {

  },
  week(el) {

    S.week = v === 0 ? thisWeek() : iso(addDays(fromIso(S.week), 7 * v));
    S.day = null; render();
  },
  day(el) { S.day = +el.dataset.d; render(); },
  focus() { S.focus = !S.focus; render(); },
  done(el) {
    const k = `cvr-done-${S.week}-${S.person}`, id = el.dataset.id, d = LS.get(k, []);
    const i = d.indexOf(id); if (i < 0) { d.push(id); toast('🧽 ¡Bien hecho!'); } else d.splice(i, 1);
    LS.set(k, d); render();
  },
  ics() { downloadICS(S.person); },
  share() { sharePerson(S.person); },
  print() { window.print(); },
  close() { closeSheet(); S.confirmDel = null; },
  copy(el) { copyText(el.dataset.v); },

  cell(el) {
    const pid = el.dataset.p, d = +el.dataset.d;
    if (!S.admin) { openSheet(sheetCellView(pid, d)); return; }
    if (!S.brush) { openCell(pid, d); return; }
    const old = getE(pid, d) || {};
    let e;
    if (S.brush === 'X') e = null;
    else if (S.brush === 'D' || AWAY[S.brush]) e = { s: S.brush };
    else {
      e = { s: S.brush };
      if (S.brush === 'C') { e.start = S.brushCustom.start; e.end = S.brushCustom.end; }
      if (old.a) e.a = old.a;
      if (old.n) e.n = old.n;
    }
    mutate(() => setE(pid, d, e));
  },
  brush(el) {
    const b = el.dataset.b || null;
    if (b === 'C' && S.brush === 'C') { openSheet(sheetBrush); return; }
    S.brush = S.brush === b ? null : b;
    if (S.brush === 'C') openSheet(sheetBrush);
    renderDock();
  },
  undo,
  'e-shift'(el) {
    const v = el.dataset.v;
    if (v === 'C' && E.s && E.s !== 'C' && shiftById(E.s)) { const sh = shiftById(E.s); E.start = sh.start; E.end = sh.end; }
    E.s = v; drawSheet();
  },
  'e-area'(el) { E.a = el.dataset.v; drawSheet(); },
  'e-label'(el) { E.label = E.label === el.dataset.v ? '' : el.dataset.v; drawSheet(); },
  'e-noteidea'(el) { E.n = E.n === el.dataset.v ? '' : el.dataset.v; drawSheet(); },
  'e-allweek'() { E.days = [0, 1, 2, 3, 4, 5, 6]; drawSheet(); },
  'e-day'(el) {
    const v = +el.dataset.v, i = E.days.indexOf(v);
    if (i < 0) E.days.push(v); else if (E.days.length > 1) E.days.splice(i, 1);
    drawSheet();
  },
  'e-allwork'() {
    E.days = [0, 1, 2, 3, 4, 5, 6].filter(d => { const x = getE(E.pid, d); return d === E.d || !x || x.s !== 'D'; });
    drawSheet();
  },
  'e-save': saveCell,
  't-nudge'(el) { const T = tgt(el.dataset.t), k = el.dataset.k; T[k] = toHHMM(toMin(T[k]) + +el.dataset.v); drawSheet(); renderDock(); },
  't-start'(el) { const T = tgt(el.dataset.t), m = dur(T.start, T.end); T.start = el.dataset.v; T.end = toHHMM(toMin(T.start) + m); drawSheet(); renderDock(); },
  't-dur'(el) { const T = tgt(el.dataset.t); T.end = toHHMM(toMin(T.start) + +el.dataset.v * 60); drawSheet(); renderDock(); },

  clean(el) { const c = getClean(el.dataset.p); CL = { pid: el.dataset.p, tasks: c.tasks.slice(), note: c.note || '' }; openSheet(sheetClean); },
  'cl-toggle'(el) { const v = el.dataset.v, i = CL.tasks.indexOf(v); if (i < 0) CL.tasks.push(v); else CL.tasks.splice(i, 1); drawSheet(); },
  'cl-save'() { mutate(() => { const c = getClean(CL.pid, S.week, true); c.tasks = CL.tasks.slice(); c.note = CL.note.trim(); }); closeSheet(); toast('✓ Limpiezas guardadas'); },

  admin() {
    if (S.admin) { openSheet(sheetMenu); return; }
    openSheet(sheetPin); setTimeout(() => { const p = $('#pinInput'); if (p) p.focus(); }, 300);
  },
  'pin-ok'() {
    if (!pinOk($('#pinInput').value)) { toast('PIN incorrecto'); $('#pinInput').value = ''; return; }
    S.admin = true; LS.set('cvr-admin', true); applyDraft(); closeSheet();
    if (S.view === 'pick') S.view = 'team';
    render(); toast('🔓 Modo administrador activo');
  },
  menu() { openSheet(sheetMenu); },
  logout() {
    S.admin = false; S.brush = null; LS.del('cvr-admin');
    DATA = normalize(JSON.parse(PUB_STR)); closeSheet(); render();
    toast('🔒 Saliste del modo administrador' + (LS.get('cvr-draft') ? ' (tu borrador quedó guardado)' : ''));
  },
  discard() { S.undo.push(JSON.stringify(DATA)); DATA = normalize(JSON.parse(PUB_STR)); LS.del('cvr-draft'); S.staleDraft = false; closeSheet(); render(); toast('↩️ Volviste a lo publicado'); },
  'dismiss-stale'() { S.staleDraft = false; render(); },
  'copy-prev'() { closeSheet(); copyWeek(iso(addDays(fromIso(S.week), -7)), S.week, false); },
  rotate() { closeSheet(); copyWeek(iso(addDays(fromIso(S.week), -7)), S.week, true); },
  'copy-next'() { closeSheet(); const nx = iso(addDays(fromIso(S.week), 7)); copyWeek(S.week, nx, false); S.week = nx; S.day = null; render(); },
  'clear-week'() { closeSheet(); mutate(() => { delete DATA.weeks[S.week]; }); toast('🗑️ Semana vaciada · ↶ para deshacer'); },
  staff() { S.confirmDel = null; openSheet(sheetStaff); },
  'st-add'() {
    const inp = $('#newStaff'), name = inp.value.trim();
    if (!name) return;
    let id = slug(name), n = 2; while (staffById(id)) id = slug(name) + '-' + n++;
    mutate(() => DATA.staff.push({ id, name, color: PALETTE[DATA.staff.length % PALETTE.length] }));
    drawSheet(); toast(`✓ ${esc(name)} agregado`);
  },
  'st-move'(el) {
    const i = DATA.staff.findIndex(s => s.id === el.dataset.id), j = i + +el.dataset.v;
    if (j < 0 || j >= DATA.staff.length) return;
    mutate(() => { const a = DATA.staff; [a[i], a[j]] = [a[j], a[i]]; }); drawSheet();
  },
  'st-del'(el) {
    const id = el.dataset.id;
    if (S.confirmDel !== id) { S.confirmDel = id; drawSheet(); return; }
    S.confirmDel = null;
    mutate(() => { DATA.staff = DATA.staff.filter(s => s.id !== id); });
    if (S.person === id) { S.person = null; if (S.view === 'me') S.view = 'team'; render(); }
    drawSheet(); toast('Persona quitada · ↶ para deshacer');
  },
  settings() { openSheet(sheetSettings); },
  'sh-add'() {
    let n = 1; while (shiftById('S' + n)) n++;
    mutate(() => DATA.config.shifts.push({ id: 'S' + n, name: 'Turno ' + (DATA.config.shifts.length + 1), short: 'T' + (DATA.config.shifts.length + 1), start: '10:00', end: '17:00', color: PALETTE[(DATA.config.shifts.length + 4) % PALETTE.length] }));
    drawSheet();
  },
  'sh-del'(el) { mutate(() => { DATA.config.shifts = DATA.config.shifts.filter(s => s.id !== el.dataset.id); }); drawSheet(); toast('Turno eliminado · las celdas que lo usaban quedan sin asignar'); },
  'ct-add'() {
    const name = $('#ctName').value.trim(), icon = $('#ctIcon').value.trim() || '🧼';
    if (!name) return;
    let id = slug(name), n = 2; while (DATA.config.cleanTasks.some(t => t.id === id)) id = slug(name) + '-' + n++;
    mutate(() => DATA.config.cleanTasks.push({ id, name, icon })); drawSheet();
  },
  'ct-del'(el) { mutate(() => { DATA.config.cleanTasks = DATA.config.cleanTasks.filter(t => t.id !== el.dataset.id); }); drawSheet(); },
  'pin-set'() {
    const p = $('#newPin').value.trim();
    if (!/^\d{4,8}$/.test(p)) { toast('El PIN debe tener de 4 a 8 números'); return; }
    mutate(() => { DATA.config.pinHash = hashPin(p); }); $('#newPin').value = '';
    toast('🔑 PIN cambiado. Publica para que aplique en todos lados.');
  },
  links() { openSheet(sheetLinks); },
  github() { openSheet(sheetGH); },
  'gh-save'() {
    const g = {}; ['owner', 'repo', 'branch', 'path', 'token'].forEach(k => g[k] = $('#gh-' + k).value.trim());
    LS.set('cvr-gh', g); closeSheet(); toast('✓ Conexión guardada'); renderDock();
  },
  async 'gh-test'() {
    const g = {}; ['owner', 'repo', 'branch', 'path', 'token'].forEach(k => g[k] = $('#gh-' + k).value.trim());
    if (!g.token) { toast('Pega el token primero'); return; }
    toast('Probando…');
    try {
      const r = await ghFetch(g, 'GET');
      if (r.ok || r.status === 404) {
        const rr = await fetch(`https://api.github.com/repos/${encodeURIComponent(g.owner)}/${encodeURIComponent(g.repo)}`, { headers: { Authorization: 'Bearer ' + g.token } });
        const j = rr.ok ? await rr.json() : {};
        toast(j.permissions && j.permissions.push ? '✅ Conexión correcta, puedes publicar' : '⚠️ Conecta, pero el token parece no tener permiso de escritura', 4000);
      } else toast('❌ ' + esc(await ghError(r)), 4500);
    } catch (e) { toast('❌ Sin conexión con GitHub', 4000); }
  },
  publish,
  export() { download(`horario-cocina-${iso(new Date())}.json`, JSON.stringify(DATA, null, 1), 'application/json'); closeSheet(); },
  import() { $('#importFile').click(); }
};

function sheetBrush() {
  return `<h3>🖌️ Pincel personalizado</h3><div class="sub">Elige la hora y luego toca las celdas para pintarlas.</div>
    ${customEditor('brush')}
    <div class="row-btns"><button class="btn primary" data-act="close">Listo, a pintar</button></div>`;
}

const CHANGE = {
  daynote(el) { mutate(() => { const w = weekObj(S.week, true); w.notes[S.day] = el.value.trim(); }); toast('📣 Aviso guardado'); },
  'st-name'(el) { const v = el.value.trim(); if (!v) return; mutate(() => { staffById(el.dataset.id).name = v; }); },
  'st-color'(el) { mutate(() => { staffById(el.dataset.id).color = el.value; }); },
  'sh-name'(el) { mutate(() => { shiftById(el.dataset.id).name = el.value.trim() || 'Turno'; }); },
  'sh-short'(el) { mutate(() => { shiftById(el.dataset.id).short = (el.value.trim() || 'T').toUpperCase(); }); },
  'sh-start'(el) { if (el.value) mutate(() => { shiftById(el.dataset.id).start = el.value; }); drawSheet(); },
  'sh-end'(el) { if (el.value) mutate(() => { shiftById(el.dataset.id).end = el.value; }); drawSheet(); },
  'sh-color'(el) { mutate(() => { shiftById(el.dataset.id).color = el.value; }); },
  'cfg-min'(el) { mutate(() => { DATA.config.minPerDay = Math.max(0, +el.value || 0); }); },
  'cfg-max'(el) { mutate(() => { DATA.config.maxHours = Math.max(1, +el.value || 48); }); },
  't-time'() { drawSheet(); }
};
const INPUT = {
  'e-note'(el) { E.n = el.value; },
  'e-label'(el) { E.label = el.value; },
  'cl-note'(el) { CL.note = el.value; },
  't-time'(el) {
    if (!el.value) return;
    const T = tgt(el.dataset.t); T[el.dataset.k] = el.value;
    const lbl = $('#t12-' + el.dataset.k); if (lbl) lbl.textContent = fmt(el.value);
    const m = dur(T.start, T.end), dl = $('#durline'); if (dl) dl.innerHTML = `Duración: <b>${fmtDur(m)}</b>`;
    renderDock();
  }
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const fn = ACT[t.dataset.act];
  if (fn) { if (t.tagName !== 'A') e.preventDefault(); fn(t, e); }
});
document.addEventListener('change', e => { const t = e.target.closest('[data-change]'); if (t && CHANGE[t.dataset.change]) CHANGE[t.dataset.change](t); });
document.addEventListener('input', e => { const t = e.target.closest('[data-input]'); if (t && INPUT[t.dataset.input]) INPUT[t.dataset.input](t); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && SHEET) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'pinInput') ACT['pin-ok']();
  if (e.key === 'Enter' && e.target.id === 'newStaff') ACT['st-add']();
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && S.admin && !SHEET && !/INPUT|TEXTAREA/.test(e.target.tagName)) { e.preventDefault(); undo(); }
});
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = normalize(JSON.parse(await f.text()));
    if (!Array.isArray(d.staff)) throw 0;
    mutate(() => { DATA = d; }); closeSheet(); toast('⬆️ Respaldo cargado. Revisa y publica.');
  } catch (err) { toast('❌ Ese archivo no es un respaldo válido'); }
  e.target.value = '';
});

/* ═══════════ TEMA / INICIO ═══════════ */
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  $('#themeBtn').textContent = t === 'dark' ? '🌙' : '☀️';
  document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#121110' : '#f5f1ea';
}
setTheme(LS.get('cvr-theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));

// Actualiza el estado "entras en / sales en" cada 30 s sin redibujar todo
setInterval(() => {
  if (!DATA || S.view !== 'me' || SHEET) return;
  const h = $('#hero'); if (h) h.outerHTML = heroCard(S.person);
}, 30000);
// Al volver a la app, trae lo último publicado (solo vista de equipo)
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || S.admin || SHEET || !DATA) return;
  const before = PUB_STR; await load();
  if (PUB_STR !== before) { render(); toast('🔄 Horario actualizado'); } else if (S.view === 'me') { const h = $('#hero'); if (h) h.outerHTML = heroCard(S.person); }
});

(async function init() {
  await load();
  readURL();
  render();
  if (S.wantAdmin && !S.admin) ACT.admin();
})();
</script>
</body>
</html>
